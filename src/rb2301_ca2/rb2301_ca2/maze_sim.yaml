# Fixed Gazebo simulation test room. Not part of the maze_id-selectable set -- there is
# only one CA2 Gazebo world (path_planning_world_ca2.sdf), which physically matches this
# map's size/origin, not the (much smaller) real mazes.
#
# ca2_sim_map.npy was found to be flipped along its y-axis relative to the actual Gazebo
# world (confirmed via live ground-truth pose: wall_0's real position and the robot's
# actual position both tested backwards against the original array). Fixed by flipping
# the array itself (see git history). goal_list below is the original list mirrored
# through the same flip (new_y = 2*origin_y + height*resolution - old_y) and verified
# reachable from the spawn point via A* -- pending final live confirmation in a working
# sim environment.
description: "Gazebo simulation test room (path_planning_world_ca2.sdf)"
resolution: 0.2
origin: [-1.0, -5.0]
map_file: ca2_sim_map.npy
goal_list:
  - [3.4, -0.4]
  - [3.2, -4.2]
  - [2.4, -0.4]
  - [-0.4, -0.2]
